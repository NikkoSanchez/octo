name: Swift
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-26
        with:
          persist-credentials: false
      - name: Reject private data
        run: python3 Scripts/check-private-data.py
      - name: Privacy check tests
        run: python3 -m unittest discover -s Tests/PrivacyChecks
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Package native app
        run: ./Scripts/build-app.sh
